<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Étoile Fine Dining E2E Test — Experience</title>
  <meta name="description" content="Uncompromising Cinematic KDL Gold Standard Experience. High-end landing page created by KDL Framework.">
  
  <meta property="og:title" content="L'Étoile Fine Dining E2E Test — Experience">
  <meta property="og:description" content="Uncompromising Cinematic KDL Gold Standard Experience. High-end landing page created by KDL Framework.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="./styles.css">
  <script type="application/ld+json">
  {
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "L'Étoile Fine Dining E2E Test",
  "description": "Uncompromising Cinematic KDL Gold Standard Experience. High-end landing page created by KDL Framework."
}
  </script>
</head>
<body>
  <header class="header bento-grid" style="padding-top: 2rem; padding-bottom: 2rem;">
    <div style="grid-column: span 12; display: flex; justify-content: space-between; align-items: center;">
      <h2 style="font-size: 1.5rem; letter-spacing: -0.02em;">L'Étoile Fine Dining E2E Test</h2>
      <button class="btn-primary">Reservar Agora</button>
    </div>
  </header>

  <main>
    <section class="hero bento-grid" style="min-height: 80vh; align-items: center; padding-top: 4rem;">
      <div style="grid-column: span 8;">
        <span style="color: var(--color-accent-10); text-transform: uppercase; font-weight: 700; letter-spacing: 0.1em; font-size: 0.875rem;">Cinematic KDL Gold Standard</span>
        <h1 style="font-size: clamp(2.5rem, 6vw, 5rem); margin-top: 1rem; margin-bottom: 1.5rem;">Uncompromising Cinematic KDL Gold Standard Experience</h1>
        <p style="font-size: 1.25rem; color: var(--color-text-secondary); max-width: 36ch; line-height: 1.6;">Exclusivity & High-Trust Mastery — Projetado autonomamente pelo KDL Framework.</p>
        <div style="margin-top: 2.5rem;">
          <button class="btn-primary">Descubra a Experiência</button>
        </div>
      </div>
      <div style="grid-column: span 4; background-color: var(--color-secondary-30); height: 400px; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
        <span style="color: var(--color-text-secondary);">Stage Showcase</span>
      </div>
    </section>
  </main>

  <footer style="text-align: center; padding: 4rem 1rem; border-top: 1px solid var(--color-secondary-30); color: var(--color-text-secondary);">
    <p>© 2026 L'Étoile Fine Dining E2E Test. Powered by KDL Landing Framework.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script>
  
// Initialize Lenis Smooth Scroll
const lenis = new Lenis({
  duration: 1.2,
  easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
  smoothWheel: true,
});

function raf(time) {
  lenis.raf(time);
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

// Initialize GSAP ScrollTrigger
gsap.registerPlugin(ScrollTrigger);

gsap.from('.hero h1', {
  y: 60,
  opacity: 0,
  duration: 0.6,
  ease: 'cubic-bezier(0.16, 1, 0.3, 1)',
});

gsap.from('.btn-primary', {
  scale: 0.9,
  opacity: 0,
  duration: 0.25,
  delay: 0.3,
  ease: 'back.out(1.7)',
});

  </script>
</body>
</html>
